<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hackathon GitHub Metrics Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    h1 { color: #38bdf8; }
    .summary-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 20px 0 0; }
    .summary-card { background: linear-gradient(135deg, #1e293b, #172033); border: 1px solid #334155; border-radius: 12px; padding: 18px 20px; box-shadow: 0 10px 30px rgba(2, 6, 23, 0.25); }
    .summary-label { display: block; color: #94a3b8; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .summary-value { display: block; margin-top: 8px; font-size: 34px; font-weight: 700; line-height: 1; }
    .summary-card:nth-child(1) .summary-value { color: #38bdf8; }
    .summary-card:nth-child(2) .summary-value { color: #a78bfa; }
    .summary-card:nth-child(3) .summary-value { color: #4ade80; }
    .summary-card:nth-child(4) .summary-value { color: #fbbf24; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #334155; color: #94a3b8; text-transform: uppercase; font-size: 12px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .badge-yes { background: #15803d; color: #dcfce7; }
    .badge-no { background: #b91c1c; color: #fee2e2; }
    @media (max-width: 800px) {
      .summary-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .summary-bar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>Hackathon GitHub Telemetry Live View</h1>
  <section class="summary-bar" aria-label="Aggregate metrics">
    <article class="summary-card">
      <span class="summary-label">Total Projects</span>
      <span class="summary-value" id="summary-projects">0</span>
    </article>
    <article class="summary-card">
      <span class="summary-label">Total Commits</span>
      <span class="summary-value" id="summary-commits">0</span>
    </article>
    <article class="summary-card">
      <span class="summary-label">Total Videos</span>
      <span class="summary-value" id="summary-videos">0</span>
    </article>
    <article class="summary-card">
      <span class="summary-label">Total Presentations</span>
      <span class="summary-value" id="summary-presentations">0</span>
    </article>
  </section>
  <table>
    <thead>
      <tr>
        <th>Team / Repo</th>
        <th>Total Commits</th>
        <th>README.md</th>
        <th>Demo Video</th>
        <th>Presentation</th>
        <th>Last Updated</th>
      </tr>
    </thead>
    <tbody id="metrics-body">
      <tr><td colspan="6">Waiting for incoming GitHub webhooks...</td></tr>
    </tbody>
  </table>

  <script>
    const socket = io();
    const tbody = document.getElementById('metrics-body');
    const summaryElements = {
      projects: document.getElementById('summary-projects'),
      commits: document.getElementById('summary-commits'),
      videos: document.getElementById('summary-videos'),
      presentations: document.getElementById('summary-presentations'),
    };

    function calculateSummary(teams) {
      return {
        totalProjects: teams.length,
        totalCommits: teams.reduce((sum, team) => sum + (Number(team.totalCommits) || 0), 0),
        totalVideos: teams.filter((team) => team.hasVideo).length,
        totalPresentations: teams.filter((team) => team.hasPresentation).length,
      };
    }

    function renderSummary(summary) {
      summaryElements.projects.textContent = summary.totalProjects ?? 0;
      summaryElements.commits.textContent = summary.totalCommits ?? 0;
      summaryElements.videos.textContent = summary.totalVideos ?? 0;
      summaryElements.presentations.textContent = summary.totalPresentations ?? 0;
    }

    socket.on('metrics-updated', (data) => {
      const teamsData = data && data.teams ? data.teams : data || {};
      const teams = Object.values(teamsData);
      const summary = data && data.summary ? data.summary : calculateSummary(teams);

      renderSummary(summary);

      if (teams.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">Waiting for incoming GitHub webhooks...</td></tr>';
        return;
      }

      tbody.innerHTML = teams.map(team => `
        <tr>
          <td><strong>${team.teamName}</strong></td>
          <td>${team.totalCommits}</td>
          <td><span class="badge ${team.hasReadme ? 'badge-yes' : 'badge-no'}">${team.hasReadme ? 'YES' : 'NO'}</span></td>
          <td><span class="badge ${team.hasVideo ? 'badge-yes' : 'badge-no'}">${team.hasVideo ? 'YES' : 'NO'}</span></td>
          <td><span class="badge ${team.hasPresentation ? 'badge-yes' : 'badge-no'}">${team.hasPresentation ? 'YES' : 'NO'}</span></td>
          <td>${new Date(team.lastUpdated).toLocaleTimeString()}</td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
