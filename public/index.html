<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hackathon GitHub Metrics Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    h1 { color: #38bdf8; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #334155; color: #94a3b8; text-transform: uppercase; font-size: 12px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .badge-yes { background: #15803d; color: #dcfce7; }
    .badge-no { background: #b91c1c; color: #fee2e2; }
  </style>
</head>
<body>
  <h1>Hackathon GitHub Telemetry Live View</h1>
  <table>
    <thead>
      <tr>
        <th>Team / Repo</th>
        <th>Total Commits</th>
        <th>README.md</th>
        <th>Demo Video</th>
        <th>Presentation</th>
        <th>Last Updated</th>
      </tr>
    </thead>
    <tbody id="metrics-body">
      <tr><td colspan="6">Waiting for incoming GitHub webhooks...</td></tr>
    </tbody>
  </table>

  <script>
    const socket = io();
    const tbody = document.getElementById('metrics-body');

    socket.on('metrics-updated', (data) => {
      const teams = Object.values(data);
      if (teams.length === 0) return;

      tbody.innerHTML = teams.map(team => `
        <tr>
          <td><strong>${team.teamName}</strong></td>
          <td>${team.totalCommits}</td>
          <td><span class="badge ${team.hasReadme ? 'badge-yes' : 'badge-no'}">${team.hasReadme ? 'YES' : 'NO'}</span></td>
          <td><span class="badge ${team.hasVideo ? 'badge-yes' : 'badge-no'}">${team.hasVideo ? 'YES' : 'NO'}</span></td>
          <td><span class="badge ${team.hasPresentation ? 'badge-yes' : 'badge-no'}">${team.hasPresentation ? 'YES' : 'NO'}</span></td>
          <td>${new Date(team.lastUpdated).toLocaleTimeString()}</td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
